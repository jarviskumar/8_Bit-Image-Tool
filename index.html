<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8_BIT IMAGE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>
<body onload="document.getElementById('main-wrapper').style.opacity = '1'">

    <header>
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <span class="brand">8_Bit Image</span>
                <span class="version">V 1.20_new</span>
            </div>
            <div class="text-muted small d-none d-md-block">// Developed_BY_DIPESH</div>
        </div>
    </header>

    <div class="container" id="main-wrapper">
      <div class="row g-5">
        <div class="col-lg-6">
            <h5 class="mb-4 text-uppercase fw-bold">> CONFIGURATION</h5>

            <div class="mb-3">
                <label class="small fw-bold">INPUT_FILE</label>
                <input type="file" class="form-control" id="upload" accept="image/*">
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label class="small fw-bold">WIDTH_PX</label>
                    <input type="number" id="width" class="form-control" placeholder="AUTO">
                </div>
                <div class="col">
                    <label class="small fw-bold">HEIGHT_PX</label>
                    <input type="number" id="height" class="form-control" placeholder="AUTO">
                </div>
            </div>

            <div class="mb-4">
                <label class="small fw-bold">TARGET_FILESIZE_KB</label>
                <input type="number" id="targetKB" class="form-control" placeholder="OPTIONAL">
            </div>
            <!-- alert area -->
            <div id="errorLog" class="d-none mt-2 mb-3 fw-bold px-2 py-1" style="border: 2px solid #ff0000; color: #ff0000; font-size: 0.75rem; background: #fff5f5;">
                > ERROR: FILE_INPUT_NOT_FOUND
            </div>

            <button id="processBtn" onclick="processImage()" class="btn btn-primary w-100 py-3 fw-bold position-relative">
                <span id="btnText">EXECUTE_RESIZE</span>
                <div id="btnProgressBar" class="btn-inner-progress"></div>
            </button>
        </div>

        <div class="col-lg-6">
            <h5 class="mb-4 text-uppercase fw-bold">> OUTPUT_PREVIEW</h5>
            <div class="preview-box border">
                <div id="placeholder" class="text-muted small">NO_DATA_AVAILABLE</div>
                <img id="outputImage">
            </div>

            <div id="statsSection" class="d-none mt-3">
                <div class="stats-label">Process_Report</div>
                <div id="stats" class="fw-bold mb-3 small"></div>

                <div class="d-flex gap-2">
                    <a id="downloadBtn" download="RESIZED_IMG.jpg" class="flex-grow-1 text-decoration-none">
                        <button class="btn btn-outline-success w-100 py-2 fw-bold">SAVE_TO_DISK</button>
                    </a>
                    <button onclick="softReset()" class="btn btn-outline-danger py-2 fw-bold">RESET</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="main.js"></script>
<!-- Make me Offline App-->
 <script>
    // Register Service Worker for Offline Support
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => console.log('SW Failed', err));
    });
}
</script>
</body>

</html>
